<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Mode Login</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font from Google Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-900 flex items-center justify-center min-h-screen p-4">

    <!-- Login Container -->
    <div class="w-full max-w-sm bg-gray-800 rounded-xl shadow-2xl p-8 transform transition-all duration-500 hover:scale-105">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-gray-100">লগইন</h1>
            <p class="text-gray-400 mt-2">আপনার অ্যাকাউন্টে লগইন করুন</p>
        </div>
        
        <form action="#" method="POST">
            <!-- Email Input -->
            <div class="mb-5">
                <label for="email" class="block text-sm font-medium text-gray-300 mb-2">ইমেল</label>
                <div class="relative">
                    <input type="email" id="email" name="email" required class="w-full pl-10 pr-4 py-2 rounded-lg border border-gray-700 bg-gray-900 text-gray-100 focus:border-indigo-500 focus:ring-indigo-500 focus:outline-none transition duration-200">
                    <!-- Email Icon -->
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1a8 8 0 11-16 0A8 8 0 0116 12z" />
                        </svg>
                    </span>
                </div>
            </div>
            
            <!-- Password Input -->
            <div class="mb-6">
                <label for="password" class="block text-sm font-medium text-gray-300 mb-2">পাসওয়ার্ড</label>
                <div class="relative">
                    <input type="password" id="password" name="password" required class="w-full pl-10 pr-10 py-2 rounded-lg border border-gray-700 bg-gray-900 text-gray-100 focus:border-indigo-500 focus:ring-indigo-500 focus:outline-none transition duration-200">
                    <!-- Password Icon (Eye) - Toggles visibility -->
                    <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-3 flex items-center">
                        <!-- Eye open icon -->
                        <svg id="eye-open" class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        <!-- Eye slash icon (initially hidden) -->
                        <svg id="eye-slash" class="h-5 w-5 text-gray-400 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.25h2.125a2.125 2.125 0 002.125-2.125V12a2.125 2.125 0 00-2.125-2.125H8.875M12 12v.01M16.5 16.5V12.75M10.125 5.25v2.25" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>
            
            <!-- Forgot Password Link & Checkbox -->
            <div class="flex items-center justify-between mb-6">
                <div class="flex items-center">
                    <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 text-indigo-500 focus:ring-indigo-500 border-gray-600 rounded">
                    <label for="remember-me" class="ml-2 block text-sm text-gray-300">
                        আমাকে মনে রাখুন
                    </label>
                </div>
                <a href="#" class="text-sm text-indigo-500 hover:text-indigo-400 hover:underline">পাসওয়ার্ড ভুলে গেছেন?</a>
            </div>

            <!-- Login Button -->
            <div>
                <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-200">
                    লগইন করুন
                </button>
            </div>
        </form>
        
        <!-- Social Login & Sign Up link -->
        <div class="mt-6 text-center">
            <p class="text-gray-400 mb-4">অথবা</p>
            <div class="flex justify-center space-x-4">
                <button class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg flex items-center space-x-2 transition duration-200">
                    <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M20.283 1.637H3.637C2.793 1.637 2.1 2.33 2.1 3.174v17.159c0 .844.693 1.536 1.537 1.536h16.646c.844 0 1.537-.692 1.537-1.536V3.174c0-.844-.693-1.537-1.537-1.537zM18.816 8.35h-3.415v-1.724c0-.447.33-.82.802-.82h2.522c.447 0 .82-.33.82-.802V3.174c0-.447-.33-.82-.82-.82h-4.22c-2.484 0-4.502 2.018-4.502 4.502v4.22h-1.537c-.447 0-.82.33-.82.82v1.537c0 .447.33.82.82.82h1.537v5.122c0 .447.33.82.82.82h3.415c.447 0 .82-.33.82-.82v-5.122h2.522c.447 0 .82-.33.82-.82v-1.537c0-.447-.33-.82-.82-.82z"/>
                    </svg>
                    <span>Google</span>
                </button>
                <button class="bg-gray-700 hover:bg-gray-900 text-white font-bold py-2 px-4 rounded-lg flex items-center space-x-2 transition duration-200">
                    <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 0C5.373 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387-.602-.553-1.047-1.25-1.298-2.015-.252-.765-.378-1.54-.378-2.355v-.785l1.643-1.643c.447-.447.785-.945 1.047-1.5.262-.555.424-1.157.487-1.785.062-.628.062-1.26-.002-1.89-.065-.63-.193-1.258-.387-1.875-.194-.617-.463-1.198-.802-1.737-.34-.539-.747-1.037-1.22-1.49-.473-.453-.987-.85-1.54-1.19-.553-.34-1.14-.61-1.76-.81-.62-.2-.685-.262-.777-.387-.092-.125-.13-.275-.115-.46l.015-.09c.015-.09.04-.15.075-.18.035-.03.07-.045.105-.045.035 0 .06.015.075.045.015.03.04.09.075.18l.015.09c.015.09.04.15.075.18.035-.03.07-.045.105-.045.035 0 .06.015.075.045.015.03.04.09.075.18l.015.09c.015.09.04.15.075.18.035-.03.07-.045.105-.045.035 0 .06.015.075.045.015.03.04.09.075.18l.015.09c.015.09.04.15.075.18.035-.03.07-.045.105-.045.035 0 .06.015.075.045.015.03.04.09.075.18l.015.09c.015.09.04.15.075.18.035-.03.07-.045.105-.045.035 0 .06.015.075.045.015.03.04.09.075.18l.015.09c.015.09.04.15.075.18.035-.03.07-.045.105-.045.035 0 .06.015.075.045.015.03.04.09.075.18l.015.09c.015.09.04.15.075.18.035-.03.07-.045.105-.045.035 0 .06.015.075.045.015.03.04.09.075.18l.015.09c.015.09.04.15.075.18.035-.03.07-.045.105-.045.035 0 .06.015.075.045.015.03.04.09.075.18l.015.09c.015.09.04.15.075.18.035-.03.07-.045.105-.045.035 0 .06.015.075.045.015.03.04.09.075.18l.015.09c.015.09.04.15.075.18.035-.03.07-.045.105-.045.035 0 .06.015.075.045.015.03.04.09.075.18l.015.09c.015.09.04.15.075.18.035-.03.07-.045.105-.045.035 0 .06.015.075.045.015.03.04.09.075.18l.015.09c.015.09.04.15.075.18.035-.03.07-.045.105-.045.035 0 .06.015.075.045.015.03.04.09.075.18l.015.09c.015.09.04.15.075.18.035-.03.07-.045.105-.045.035 0 .06.015.075.045.015.03.04.09.075.18l.015.09c.015.09.04.15.075.18.035-.03.07-.045.105-.045.035 0 .06.015.075.045.015.03.04.09.075.18l-1.643-1.643v-2.115c0-.815.126-1.589.378-2.355.251-.765.696-1.462 1.298-2.015-4.769-1.587-8.207-6.085-8.207-11.387zM18.816 8.35h-3.415v-1.724c0-.447.33-.82.802-.82h2.522c.447 0 .82-.33.82-.802V3.174c0-.447-.33-.82-.82-.82h-4.22c-2.484 0-4.502 2.018-4.502 4.502v4.22h-1.537c-.447 0-.82.33-.82.82v1.537c0 .447.33.82.82.82h1.537v5.122c0 .447.33.82.82.82h3.415c.447 0 .82-.33.82-.82v-5.122h2.522c.447 0 .82-.33.82-.82v-1.537c0-.447-.33-.82-.82-.82z"/>
                    </svg>
                    <span>Github</span>
                </button>
            </div>
            
            <p class="mt-4 text-center text-sm text-gray-400">
                নতুন ব্যবহারকারী?
                <a href="#" class="font-medium text-indigo-500 hover:text-indigo-400 hover:underline">একটি নতুন অ্যাকাউন্ট তৈরি করুন</a>
            </p>
        </div>
    </div>

    <!-- JavaScript to toggle password visibility -->
    <script>
        document.addEventListener('DOMContentLoaded', (event) => {
            const togglePassword = document.getElementById('togglePassword');
            const password = document.getElementById('password');
            const eyeOpen = document.getElementById('eye-open');
            const eyeSlash = document.getElementById('eye-slash');

            togglePassword.addEventListener('click', function (e) {
                // Toggle the type attribute
                const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
                password.setAttribute('type', type);
                
                // Toggle the eye icon visibility
                if (type === 'text') {
                    eyeOpen.classList.add('hidden');
                    eyeSlash.classList.remove('hidden');
                } else {
                    eyeOpen.classList.remove('hidden');
                    eyeSlash.classList.add('hidden');
                }
            });
        });
    </script>

</body>
</html>
