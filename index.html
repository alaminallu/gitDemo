<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font for a clean look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

</head>
<body class="bg-gray-900 text-gray-100 flex items-center justify-center min-h-screen p-4">

    <!-- Main Container for Forms -->
    <div class="bg-gray-800 p-8 sm:p-12 rounded-2xl shadow-2xl w-full max-w-sm">

        <!-- Login Form -->
        <div id="login-form" class="space-y-6">
            <h2 class="text-3xl font-semibold text-center mb-6">Login</h2>
            <form action="#" method="post" class="space-y-4">
                <div>
                    <label for="login-email" class="block text-sm font-medium text-gray-300 mb-1">Email address</label>
                    <input type="email" id="login-email" name="email" required
                           class="w-full px-4 py-3 bg-gray-700 rounded-lg text-gray-200 placeholder-gray-400 focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label for="login-password" class="block text-sm font-medium text-gray-300 mb-1">Password</label>
                    <input type="password" id="login-password" name="password" required
                           class="w-full px-4 py-3 bg-gray-700 rounded-lg text-gray-200 placeholder-gray-400 focus:ring-2 focus:ring-indigo-500">
                </div>
                <button type="submit"
                        class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg transition duration-200 ease-in-out shadow-lg">
                    Log In
                </button>
            </form>
        </div>

        <!-- Register Form (initially hidden) -->
        <div id="register-form" class="space-y-6 hidden">
            <h2 class="text-3xl font-semibold text-center mb-6">Register</h2>
            <form action="#" method="post" class="space-y-4">
                <div>
                    <label for="register-name" class="block text-sm font-medium text-gray-300 mb-1">Full Name</label>
                    <input type="text" id="register-name" name="name" required
                           class="w-full px-4 py-3 bg-gray-700 rounded-lg text-gray-200 placeholder-gray-400 focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label for="register-email" class="block text-sm font-medium text-gray-300 mb-1">Email address</label>
                    <input type="email" id="register-email" name="email" required
                           class="w-full px-4 py-3 bg-gray-700 rounded-lg text-gray-200 placeholder-gray-400 focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label for="register-password" class="block text-sm font-medium text-gray-300 mb-1">Password</label>
                    <input type="password" id="register-password" name="password" required
                           class="w-full px-4 py-3 bg-gray-700 rounded-lg text-gray-200 placeholder-gray-400 focus:ring-2 focus:ring-indigo-500">
                </div>
                <button type="submit"
                        class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg transition duration-200 ease-in-out shadow-lg">
                    Register
                </button>
            </form>
        </div>

        <!-- Toggle Button -->
        <div class="mt-6 text-center text-sm">
            <p>
                <span id="toggle-text">Don't have an account?</span>
                <button id="toggle-button" class="text-indigo-400 hover:text-indigo-500 font-medium ml-1 focus:outline-none">
                    Register
                </button>
            </p>
        </div>


      

    </div>

    <script src="main.js"></script>
   
</body>
</html>
